# Kitchen-sink SPLADE data config (2026-07-21): all renderable doc-side fields.
# vs splade.yaml: + customer_artnos_text / vendor_text / category_leaf_text
# (full-depth paths, replaces L1-only category_text) / s2class_text (leaf codes
# mapped via /data/s2class-categories.json, junk 27274091 dropped) /
# keywords_text / features_text / description ON (clean_html). Field order =
# identity first, prose last, so the token cap truncates description tail, not
# identity. max_offer_length 256 -> 512 for the longer renders.
# Trainset: pipeline/build_esci_embed_eval.py --with-descriptions --with-extras
# (extras from pipeline/build_article_extras.py). Ablations planned later.
path: /home/max/simplesystem-embedding/data/splade_train_raw_fold.parquet
positive_label: Exact
column_mapping:
  query_id: query_id
  offer_id: offer_id_b64
  query_term: query_term
  name: name
  manufacturer_name: manufacturer_name
  manufacturer_article_number: manufacturer_article_number
  manufacturer_article_type: manufacturer_article_type
  article_number: article_number
  ean: ean
  category_paths: category_paths
  description: description
  label: label
batch_size: 256
train_batching_mode: random_query_pool
n_pos_samples_per_query: 2
n_neg_samples_per_query: 4
log_batch_stats: true
num_workers: 16
pin_memory: true
max_query_length: 32
max_offer_length: 512
val_fraction: 0.05
val_split_mode: query_id
clean_html: true
limit_rows: null
hard_negatives_path: null
semi_hard_negatives_path: null
ce_scores_path: null
cache_prepared_dataset: true
prepare_cache_dir: .cache/prepared_dataset
column_rename: null
# Length-bucketed batching (speed): shuffle -> window of N batches -> sort by
# rendered-offer char length -> chunk -> shuffle batch order. Cuts the ~40%
# pad-to-longest waste; batch composition stays random at window granularity.
length_bucketing: true
length_bucket_window: 16

# No e5-style "query:"/"passage:" prefixes — SPLADE has no instruction
# prefix convention and prefix terms would waste sparse activations.
query_template: |-
  {{ query_term }}

offer_template: |-
  Article Name: {{ name }}
  {% if ean %} EAN: {{ ean }}{% endif %}
  {% if article_number %} Article Number: {{ article_number }}{% endif %}
  {% if manufacturer_article_number %} Article Number (Manufacturer): {{ manufacturer_article_number }}{% endif %}
  {% if customer_artnos_text %} Customer Article Numbers: {{ customer_artnos_text }}{% endif %}
  {% if manufacturer_name %} Brand: {{ manufacturer_name }}{% endif %}
  {% if vendor_text %} Vendor: {{ vendor_text }}{% endif %}
  {% if manufacturer_article_type %} Article Type: {{ manufacturer_article_type }}{% endif %}
  {% if category_leaf_text %} Category: {{ category_leaf_text }}{% endif %}
  {% if s2class_text %} Classification: {{ s2class_text }}{% endif %}
  {% if keywords_text %} Keywords: {{ keywords_text }}{% endif %}
  {% if features_text %} Features: {{ features_text }}{% endif %}
  {% if clean_description %} Description: {{ clean_description }}{% endif %}

# Field dropout (train-time augmentation, collate-path re-render — see
# data.py). Source-column names; identity fields (name/artnos/ean/brand)
# deliberately NOT listed: masking them would decouple labels from evidence.
# p=0 disables masking; the field list alone enables offer_fields capture.
field_dropout_p: 0.0
field_dropout_fields:
  - description
  - features_text
  - keywords_text
  - category_leaf_text
  - s2class_text
  - vendor_text
  - customer_artnos_text
  - manufacturer_article_type
