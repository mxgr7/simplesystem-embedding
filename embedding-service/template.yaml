# Offer text template + preprocessing flags for the embedding-service.
#
# Lifted from `configs/data/default.yaml` (the offer_template + clean_html
# + column_rename block). Kept as a separate file inside the service so a
# bump here doesn't require rebuilding/restarting the training pipeline,
# and vice versa. Any change here that shifts the rendered text MUST be
# paired with a HASH_VERSION bump in `hashing.py` so stale cache entries
# don't get served to the new template.

clean_html: true

# Source rows arrive as snake_case dicts already (we build them positionally
# from the 8 NUL-separated fields). No rename needed at this layer, but
# leaving the hook here matches the training-time config shape so future
# divergence is a one-line edit.
column_rename: null

offer_template: |-
  passage: Article Name: {{ name }}
  {% if ean %} EAN: {{ ean }}{% endif %}
  {% if article_number %} Article Number: {{ article_number }}{% endif %}
  {% if manufacturer_article_number %} Article Number (Manufacturer): {{ manufacturer_article_number }}{% endif %}
  {% if category_text %} Category: {{ category_text }}{% endif %}
  {% if manufacturer_article_type %} Article Type: {{ manufacturer_article_type }}{% endif %}
  {% if manufacturer_name %} Brand: {{ manufacturer_name }}{% endif %}
  {% if clean_description %} Description: {{ clean_description }}{% endif %}
