openapi: 3.0.3
info:
  title: Embedding Service
  description: |
    Thin FastAPI wrapper over a TEI (HuggingFace Text Embeddings Inference)
    backend with a KVRocks-backed embedding cache in front. Speaks TEI's
    native `/embed` shape so any existing TEI client targets it by
    swapping `EMBED_URL`.

    Each input string must be exactly **8 NUL-separated field values** in
    this order:

    1. `name`
    2. `manufacturerName`
    3. `description`
    4. `categoryPaths`
    5. `ean`
    6. `article_number`
    7. `manufacturerArticleNumber`
    8. `manufacturerArticleType`

    Inputs are SHA-256-hashed (first 16 bytes → 32-char hex), looked up
    in the cache under key `tei:v2:{hash}`, and on miss are rendered
    through the same Jinja template the indexer uses, then embedded by
    TEI. The cache is written asynchronously after the response is sent.
  version: "1.0.0"

paths:
  /embed:
    post:
      summary: Embed one or more NUL-separated 8-field article texts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: One fp16-precision vector per input, in input order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items: { type: number, format: float }
                  minItems: 128
                  maxItems: 128
        "400":
          description: Malformed request (e.g. wrong field count, empty inputs).
        "401":
          description: Missing or invalid bearer token (when `API_KEY` is set).
        "413":
          description: Too many inputs in one request.
        "429":
          description: Service at concurrency limit. Includes `Retry-After`.
        "503":
          description: Connection-level overload (uvicorn `--limit-concurrency`).
        "504":
          description: Per-request budget (5s default) exhausted.

  /healthz:
    get:
      summary: Liveness probe.
      responses:
        "200":
          description: Always returns a small JSON body when the process is up.

  /readyz:
    get:
      summary: Readiness probe (real TEI embed canary + cache populated).
      description: |
        Returns 200 only when the box can actually serve embeddings:
        a real end-to-end embed canary through TEI succeeds (GPU/model
        up — bypasses the cache) AND KVRocks is reachable and populated
        (SCAN-based, so it survives KVRocks' post-restart DBSIZE reset).
        Polled by the weekly bootup automation (INFRA-1782).
      responses:
        "200":
          description: |
            Ready. `{"ready": true, "checks": {"tei_embed": "ok", "cache": "ok"}}`
        "503":
          description: |
            Not ready; the body says which check(s) failed, e.g.
            `{"ready": false, "checks": {"tei_embed": "error: ...", "cache": "empty"}}`

  /metrics:
    get:
      summary: Prometheus metrics scrape endpoint.
      responses:
        "200":
          description: Prometheus exposition format.

  /admin/backends:
    get:
      summary: List the runtime TEI backend pool.
      description: |
        Authenticates with `ADMIN_API_KEY` (falls back to `API_KEY`).
      responses:
        "200":
          description: Current backends with live inflight / health / weight.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Backend" }
    post:
      summary: Register a TEI backend at runtime.
      description: |
        Add another TEI endpoint (e.g. a bigger remote GPU for a one-off
        indexing run). Misses route across backends proportionally to
        `weight`; clients of `/embed` are unaffected. The backend starts
        unhealthy and only enters rotation once its first `/health` probe
        (kicked immediately on add) succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddBackendRequest" }
      responses:
        "200":
          description: The newly added backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }

  /admin/backends/{backend_id}:
    patch:
      summary: Re-weight a backend.
      description: Weight `0` drains a backend to fallback-only.
      parameters:
        - name: backend_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight]
              properties:
                weight: { type: number, minimum: 0 }
      responses:
        "200":
          description: The updated backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }
        "404":
          description: No such backend id.
    delete:
      summary: Gracefully drain and remove a backend.
      parameters:
        - name: backend_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: |
            Drain accepted. The backend stops taking new chunks and is
            removed once inflight finishes (or the drain timeout elapses).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }
        "404":
          description: No such backend id.

components:
  schemas:
    EmbedRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: |
            Single string or list of strings, each containing exactly
            8 NUL-separated field values in the documented order.
        truncate:
          type: boolean
          default: true
          description: |
            Forwarded to TEI on cache misses. Causes TEI to right-truncate
            inputs longer than the model's max_input_length (256 tokens)
            instead of returning 413. Belt-and-braces — the model already
            caps at 256.
    AddBackendRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: TEI base URL, e.g. `https://big-gpu.example.com`.
        weight:
          type: number
          default: 1.0
          minimum: 0
          exclusiveMinimum: true
          description: Relative capacity; misses route proportionally to weight.
        max_concurrency:
          type: integer
          default: 16
          description: Match the backend's TEI `--max-concurrent-requests`.
        max_client_batch:
          type: integer
          default: 8
          description: Match the backend's TEI `--max-client-batch-size`.
        timeout_s:
          type: number
          default: 30.0
          description: Per-request HTTP timeout for this backend.
    Backend:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        weight: { type: number }
        healthy: { type: boolean }
        draining: { type: boolean }
        inflight: { type: integer }
        max_concurrency: { type: integer }
        max_client_batch: { type: integer }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required only when `API_KEY` is set. Unset → endpoint is open.
        Format: `Authorization: Bearer <key>`.

security:
  - bearerAuth: []
  - {}
