global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # embedding-service runs network_mode:host — reach it via the host gateway
  # that compose injects into this Prometheus container's /etc/hosts.
  - job_name: embedding-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9000"]   # rebound 8082 -> 9000 for the v1-semantic indexer
        labels:
          stack: embedding-service

  # article-search-indexer — Spring Boot actuator/prometheus on the management
  # port (ACTUATOR_PORT=9091); network_mode:host, reached via the host gateway.
  - job_name: indexer
    metrics_path: /actuator/prometheus
    static_configs:
      # indexer runs on this box again (was 172.16.20.115 during the milvus-box
      # stint). Single instance only (two share a static group.instance.id under
      # host-net and fence each other). Must be ACTUATOR_PORT=9091 — the SG only
      # allows 9091 cross-box from this host (9092 is dropped/timeout).
      - targets: ["host.docker.internal:9091"]
        labels:
          stack: embedding-service

  # Kafka offset/lag exporter (scripts/kafka_lag_exporter.py) on the host —
  # exposes per-partition end/start/committed offsets for producer/consumer
  # rate + queue size + lag panels.
  - job_name: kafka_lag
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9145"]
        labels:
          stack: embedding-service

  # TEI 1.8 exposes /metrics on its container port. We scrape via the host
  # gateway too so the same Prometheus config works regardless of whether
  # TEI is on bridge (current — port-published) or host-net.
  - job_name: tei
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          stack: embedding-service

  # Remote TEI box (vast.ai) — same te_* metric names as local TEI, so
  # dashboard queries must filter by job to avoid summing the two.
  - job_name: tei_remote
    metrics_path: /metrics
    static_configs:
      - targets: ["88.207.86.141:41661"]
        labels:
          stack: embedding-service

  # redis_exporter is on the same bridge network as Prometheus — addressable
  # by service name. It pulls KVRocks's INFO/keyspace/command stats over
  # the Redis protocol on port 6666.
  - job_name: kvrocks
    metrics_path: /metrics
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          stack: embedding-service

  # NVIDIA DCGM exporter — utilization, memory, temp, power, clocks
  # per GPU. Same bridge network → service-name addressing.
  - job_name: gpu
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm_exporter:9400"]
        labels:
          stack: embedding-service

  # node_exporter runs on host net for accurate net/pid stats — reach
  # via the same host-gateway trick as the embedding-service.
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          stack: embedding-service

  # article-semantic-search query service — runs on milvus (172.16.20.115)
  # on port 9099. The SG blocks this box from reaching milvus:9099 directly,
  # so an SSH tunnel bridges it: `ssh -fN -L 172.17.0.1:19099:localhost:9099 milvus`
  # binds to the docker0 gateway (what host.docker.internal resolves to inside
  # this container), so Prometheus scrapes the local tunnel endpoint.
  # Exposes http_server_requests_seconds_* (Micrometer) for the search endpoint.
  - job_name: query_service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:19099"]
        labels:
          stack: embedding-service

  # search-prober — synthetic semantic-search prober hitting the preprod gateway
  # every 10s (health-check + ES warm-keeper). Same bridge net as Prometheus →
  # service-name addressing. Exposes probe_search_latency_seconds (histogram →
  # real preprod p50/p90/p99), probe_up, probe_requests_total, probe_hit_count.
  - job_name: search_prober
    metrics_path: /metrics
    static_configs:
      - targets: ["search-prober:9155"]
        labels:
          stack: embedding-service

  # elasticsearch_exporter — monitors the temporary semantic ES
  # (semantic-es-temp, ES 9.3.3) holding prod-article-index-v1-semantic-bf16
  # during the catch-up backfill. Same bridge network as Prometheus →
  # service-name addressing. Scrape interval relaxed because the exporter
  # hits _nodes/stats + _all/_stats + _cat/shards on each scrape.
  - job_name: semantic_es_temp
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 30s
    static_configs:
      - targets: ["elasticsearch_exporter:9114"]
        labels:
          stack: embedding-service
