global:
  scrape_interval: 15s
  evaluation_interval: 15s

# MXG-115. Until 2026-08-16 there were no rule_files and no alerting block: eleven jobs feeding
# a Prometheus that could not tell anyone about anything. A directory glob rather than named
# files, so adding a rule group needs no config reload of this file.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # embedding-service runs network_mode:host — reach it via the host gateway
  # that compose injects into this Prometheus container's /etc/hosts.
  - job_name: embedding-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9000"]   # rebound 8082 -> 9000 for the v1-semantic indexer
        labels:
          stack: embedding-service

  # article-search-indexer — Spring Boot actuator/prometheus on the management
  # port (ACTUATOR_PORT=9091); network_mode:host, reached via the host gateway.
  - job_name: indexer
    metrics_path: /actuator/prometheus
    static_configs:
      # indexer runs on this box again (was 172.16.20.115 during the milvus-box
      # stint). Single instance only (two share a static group.instance.id under
      # host-net and fence each other). Must be ACTUATOR_PORT=9091 — the SG only
      # allows 9091 cross-box from this host (9092 is dropped/timeout).
      - targets: ["host.docker.internal:9091"]
        labels:
          stack: embedding-service

  # Kafka offset/lag exporter (scripts/kafka_lag_exporter.py) on the host —
  # exposes per-partition end/start/committed offsets for producer/consumer
  # rate + queue size + lag panels.
  - job_name: kafka_lag
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9145"]
        labels:
          stack: embedding-service

  # TEI 1.8 exposes /metrics on its container port. We scrape via the host
  # gateway too so the same Prometheus config works regardless of whether
  # TEI is on bridge (current — port-published) or host-net.
  - job_name: tei
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          stack: embedding-service

  # The second TEI replica, dedicated to indexer embedding (see the `tei-indexer` service).
  # MXG-115: this was never scraped. `tei` above is the QUERY replica on :8080; the one that
  # actually has to keep up on Sunday is this one, and it was the only unmonitored process on
  # the GPU. Same te_* metric names as `tei`, so dashboard and rule queries must filter by job
  # rather than summing across them.
  - job_name: tei_indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          stack: embedding-service

  # `tei_remote` was removed here 2026-08-16 (MXG-115). It pointed at 88.207.86.141:41661,
  # a vast.ai rental destroyed weeks earlier, and had been red ever since. A permanently-red
  # target is worse than no target: it trains everyone to read a red board as normal, and it
  # is the first thing a `up == 0` alert rule would have paged on, forever.

  # MXG-111: splade-service as a co-tenant on this same T4. The frontend on :8137
  # carries the request/cache counters (splade_service_cache_hits_total etc.); it
  # runs host-net like embedding-service, so it needs the host gateway. The backend
  # on :8138 is loopback-bound and exposes no /metrics — watch it through the GPU
  # job below and its /health instead.
  #
  # Scrape it as its own job rather than folding it into the embedding-service one:
  # both stacks share this GPU, and the whole point of the co-tenancy is being able
  # to attribute a query-latency regression to one of them.
  - job_name: splade-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8137"]
        labels:
          stack: splade-service

  # MXG-144: the cross-encoder fine ranker, a THIRD tenant on this T4 — and the
  # first one that is latency-critical and on the query path. Its own job for
  # the same attribution reason splade got one, and doubly so here: measured on
  # this box, saturating either tenant costs the other ~35-50%
  # (report/pipeline_v2/mxg144_ce_service.md), so a latency regression on one
  # side is only diagnosable if the other side's rate is visible next to it.
  #
  # :8140, NOT :8139 — mxg121-splade-auth's nginx holds 8139 on the host
  # loopback with host networking, so it shows up in `ss -lntp` and in nothing
  # `docker port` prints.
  - job_name: ce-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8140"]
        labels:
          stack: ce-service

  # redis_exporter is on the same bridge network as Prometheus — addressable
  # by service name. It pulls KVRocks's INFO/keyspace/command stats over
  # the Redis protocol on port 6666.
  - job_name: kvrocks
    metrics_path: /metrics
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          stack: embedding-service

  # NVIDIA DCGM exporter — utilization, memory, temp, power, clocks
  # per GPU. Same bridge network → service-name addressing.
  - job_name: gpu
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm_exporter:9400"]
        labels:
          stack: embedding-service

  # node_exporter runs on host net for accurate net/pid stats — reach
  # via the same host-gateway trick as the embedding-service.
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          stack: embedding-service

  # `query_service` was removed here 2026-08-16 (MXG-115). It scraped the article-semantic-search
  # service on the milvus box through a hand-made SSH tunnel:
  #   ssh -fN -L 172.17.0.1:19099:localhost:9099 milvus
  # No such tunnel has existed for months, nothing listens on 19099, and the local
  # article-semantic-search container exited two months ago. A scrape target whose transport is
  # a tunnel someone has to remember to re-open by hand cannot be a monitoring foundation; if
  # the next-gen query service needs scraping, that belongs where the service is deployed.
  # The `query-service-loadtest` dashboard keeps working on the data already in the TSDB.
  #
  # `search_prober` was removed here too, with the prober itself (see compose.yaml).

  # elasticsearch_exporter — monitors `semsearchprod`, the 3-node cluster holding the live
  # article index. Same bridge network as Prometheus → service-name addressing.
  #
  # MXG-115 renamed this job from `semantic_es_temp`: the temp cluster it was named for is
  # gone, and the exporter had been reporting up=1 with zero series ever since. There was no
  # data under the old job name to preserve. 60s because each scrape costs the shared prod
  # cluster a _nodes/stats + _all/_stats.
  - job_name: semantic_es
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["elasticsearch_exporter:9114"]
        labels:
          stack: embedding-service
