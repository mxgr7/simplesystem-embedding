services:
  tei:
    # GPU build tuned for the Turing architecture (T4 / RTX 20xx).
    # On a different GPU bump the tag: ampere-86 (A10/A40/A100),
    # ampere-89 (L4/L40), hopper (H100), or cuda-<ver> for a generic
    # fallback. CPU tag is `cpu-1.8`.
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8
    # Tuned per the embedding-service plan: max sequence length 256 comes
    # from the model's `sentence_bert_config.json`; batch sizing below
    # bumped 8 -> 32 to lift GPU utilization for the prewarm — bigger
    # batches keep the GPU fed instead of paying TEI overhead per small
    # batch. `--max-batch-tokens` sized as 32×256 so a full max-length
    # client batch fits one forward pass without server-side splitting.
    command: [
      "--model-id", "/model",
      "--port", "80",
      "--pooling", "mean",
      "--max-client-batch-size", "32",
      "--max-concurrent-requests", "16",
      "--max-batch-tokens", "8192",
    ]
    ports:
      - "8080:80"
    volumes:
      - ${TEI_MODEL_DIR:-/data/tei-models/useful-cub-58-st}:/model:ro
    # Modern compose GPU access via nvidia-container-toolkit. Requires
    # `nvidia-ctk runtime configure --runtime=docker` on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  kvrocks:
    image: apache/kvrocks:latest
    # Disk-backed Redis-protocol cache. Same `tei:v2:` keyspace as
    # `indexer/tei_cache.py` so prewarmed indexer entries are served
    # by this path too. The volume already contains `db/` + `kvrocks.conf`.
    #
    # `user:` runs as the UID/GID that owns the host data files
    # (the image defaults to UID 999, which can't write to files
    # owned by anyone else). Adjust both halves if redeploying with
    # different file ownership.
    #
    # `entrypoint:` overrides the image default to move the pidfile
    # into the bind-mounted volume — the image's default
    # `--pidfile /var/run/kvrocks/kvrocks.pid` points to a dir that's
    # only writable by the in-image kvrocks user (999), not our UID.
    user: "1001:1001"
    entrypoint: [
      "kvrocks",
      "-c", "/var/lib/kvrocks/kvrocks.conf",
      "--dir", "/var/lib/kvrocks",
      "--pidfile", "/var/lib/kvrocks/kvrocks.pid",
      "--bind", "0.0.0.0",
    ]
    ports:
      - "6666:6666"
      # Extra host port for cross-box batch reindex clients (milvus): the SG
      # blocks 6666 but allows 8000. Kernel-NAT'd to the container (no socat
      # relay). 6666 stays the in-cluster/online port.
      - "8000:6666"
    volumes:
      - /mnt/nvme/kvrocks-data:/var/lib/kvrocks
    restart: unless-stopped

  embedding-service:
    build:
      context: ..
      dockerfile: embedding-service/Dockerfile
    environment:
      TEI_URL: http://localhost:8080
      KVROCKS_URL: redis://localhost:6666/0
      API_KEY: ${EMBEDDING_API_KEY:-}
      # Operator key for /admin/backends (runtime TEI pool mgmt). Falls back
      # to API_KEY when unset; if both are empty the admin API is open.
      ADMIN_API_KEY: ${EMBEDDING_ADMIN_API_KEY:-}
      TEI_MAX_CLIENT_BATCH: "8"
      TEI_MAX_CONCURRENCY: "16"
      KVROCKS_READ_TIMEOUT_MS: "50"
      # Backpressure thresholds — keep in sync with the plan defaults.
      MAX_INFLIGHT: "128"
      MAX_INPUTS_PER_REQUEST: "256"
      REQUEST_BUDGET_S: "5.0"
      RETRY_AFTER_S: "0.3"
    network_mode: host
    depends_on:
      - tei
      - kvrocks
    restart: unless-stopped

  # --- Observability ------------------------------------------------------
  # Self-contained Prom + Grafana + redis_exporter for the embedding-service
  # stack. Versions pinned to match the repo-level observability/ stack so
  # we don't fork the deployment surface; the two stacks are not designed
  # to run concurrently (they both bind 9090 / 3000 by default).

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    # KVRocks speaks the Redis protocol — same exporter works.
    command: ["--redis.addr=redis://kvrocks:6666"]
    ports:
      - "9121:9121"
    depends_on:
      - kvrocks
    restart: unless-stopped

  dcgm_exporter:
    # NVIDIA's DCGM exporter — GPU utilization, memory, temp, power,
    # clocks, SM occupancy. Scraped by Prometheus on :9400/metrics.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    # cap_add NET_ADMIN is in dcgm-exporter's docs as needed for some
    # nvlink/PCIe probes — harmless on a single-GPU box.
    cap_add:
      - SYS_ADMIN
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    restart: unless-stopped

  node_exporter:
    # Host CPU / memory / disk / filesystem / network metrics. Runs in
    # host net + host pid so node_network_* and node_load* reflect the
    # actual host rather than the container.
    image: prom/node-exporter:v1.8.2
    pid: host
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker|run)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The embedding-service runs network_mode:host, so we can't address it
    # by service name from this bridge-net Prometheus. `host-gateway` makes
    # `host.docker.internal` resolve to the host's bridge IP so the scrape
    # config can reach the host-net process.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis_exporter
      - dcgm_exporter
      - node_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anon viewer matches the repo-level observability stack — lets devs
      # land on the dashboard without a login while admin/admin still works
      # for editing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
